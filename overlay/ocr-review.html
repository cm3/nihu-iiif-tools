<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>OCR 地点番号レビュー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f7f5ef;
      --panel: #fffdf8;
      --line: #d8d0c0;
      --text: #2d2a24;
      --muted: #7b7468;
      --accent: #8b3f1f;
      --matched: #2a6629;
      --unmatched: #c0392b;
      --unmatched-bg: #fff0ee;
      --focus: #d95f02;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      font-size: 14px;
    }
    body { display: flex; flex-direction: column; }

    /* ── header ── */
    header {
      flex: 0 0 auto;
      padding: 8px 14px;
      background: rgba(247,245,239,0.96);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--line);
      z-index: 10;
    }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 3px 0; }
    kbd { background: #eee; border: 1px solid #bbb; border-radius: 3px; padding: 1px 5px; font-size: 0.88em; }
    button {
      padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px;
      background: var(--panel); color: var(--text); cursor: pointer; font-size: 0.9em;
    }
    button:hover { background: #ede8df; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { background: #7a3518; }
    label.toggle {
      display: flex; align-items: center; gap: 5px;
      cursor: pointer; user-select: none;
    }
    #status { color: var(--muted); font-size: 0.9em; }
    #pageCounter {
      font-weight: bold;
      display: flex; align-items: center; gap: 4px;
    }
    #pageInput {
      width: 4em; text-align: right;
      font-weight: bold; font-size: 1em;
      border: 1px solid var(--line); border-radius: 4px;
      padding: 1px 4px; background: var(--panel); color: var(--text);
    }
    #pageInput:focus { outline: none; border-color: var(--accent); background: #fff; }

    /* ── main split ── */
    .split {
      flex: 1 1 0;
      display: flex;
      overflow: hidden;
    }

    /* ── left panel ── */
    #leftPanel {
      flex: 0 0 300px;
      overflow-y: auto;
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 12px 14px;
    }
    #pageInfo { margin-bottom: 12px; }
    #pageInfo h2 { margin: 0 0 4px; font-size: 1rem; }
    #pageInfo .meta { color: var(--muted); font-size: 0.84em; line-height: 1.6; }
    .map-links { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .map-links a {
      font-size: 0.8em; padding: 2px 8px;
      border: 1px solid #b0c4de; border-radius: 999px;
      background: #f0f4fa; color: #345;
      text-decoration: none; white-space: nowrap;
    }
    .map-links a:hover { background: #dce8f8; border-color: #7a9cc0; }
    #locList { list-style: none; margin: 0; padding: 0; }
    #locList li {
      padding: 5px 6px;
      border-radius: 6px;
      margin-bottom: 4px;
      line-height: 1.4;
    }
    .loc-matched {
      background: #f0f8f0;
      border: 1px solid #c3dfc3;
    }
    .loc-matched-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 6px;
    }
    .loc-unmatched {
      background: var(--unmatched-bg);
      border: 1px solid #f5c0bb;
    }
    .loc-id {
      font-family: monospace;
      font-weight: bold;
      font-size: 0.95em;
    }
    .loc-id.matched { color: var(--matched); }
    .loc-id.unmatched { color: var(--unmatched); }
    .loc-place { font-size: 0.82em; color: var(--muted); }
    .btn-edit-matched {
      padding: 1px 7px;
      font-size: 0.78em;
      border: 1px solid #a8cca8;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      color: var(--matched);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-edit-matched:hover { background: #e8f5e8; }
    .loc-matched-edit { display: none; margin-top: 5px; }
    .loc-matched-edit.open { display: block; }
    .loc-edit-row { display: flex; gap: 5px; margin-top: 4px; align-items: center; }
    .loc-edit-row input[type="text"] {
      flex: 1;
      padding: 3px 6px;
      border: 1px solid #e0b0a8;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.9em;
      background: #fff;
    }
    .loc-edit-row input[type="text"].corrected {
      border-color: var(--matched);
      background: #f0f8f0;
    }
    .loc-edit-row input[type="text"].deleted {
      border-color: #aaa;
      background: #f0f0f0;
      text-decoration: line-through;
      color: var(--muted);
    }
    .btn-delete {
      padding: 2px 6px;
      font-size: 0.8em;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      color: var(--muted);
    }
    .btn-delete:hover { background: #fee; border-color: var(--unmatched); color: var(--unmatched); }
    .btn-delete.active { background: #fee; border-color: var(--unmatched); color: var(--unmatched); }
    .loc-comment {
      width: 100%;
      margin-top: 5px;
      padding: 4px 6px;
      border: 1px solid #e0d8d0;
      border-radius: 4px;
      font-size: 0.82em;
      font-family: inherit;
      resize: vertical;
      min-height: 3em;
      background: #fffdf8;
      color: var(--text);
      line-height: 1.4;
    }
    .loc-comment:focus { outline: none; border-color: var(--accent); background: #fff; }
    .loc-comment.has-comment { border-color: #b0a890; background: #faf7f0; }
    .btn-add-loc {
      display: block; width: 100%; margin-top: 10px;
      padding: 5px 0;
      border: 1px dashed var(--line); border-radius: 6px;
      background: transparent; color: var(--muted);
      cursor: pointer; font-size: 0.88em; text-align: center;
    }
    .btn-add-loc:hover { background: #e8f0ff; border-color: #7a9cc0; color: var(--text); }
    .loc-added { background: #eef4ff; border: 1px solid #b0c8e8; }
    .loc-added .loc-id { color: #2a4a8a; }
    .btn-suggest {
      padding: 2px 6px;
      font-size: 0.8em;
      border: 1px solid #b0c4de;
      border-radius: 4px;
      background: #f0f4fa;
      cursor: pointer;
      color: #345;
    }
    .btn-suggest:hover { background: #dce8f8; border-color: #7a9cc0; }

    /* ── suggest modal ── */
    #suggestModal {
      position: fixed; inset: 0; z-index: 3000;
      display: none; align-items: center; justify-content: center;
      background: rgba(30,24,18,0.5);
      padding: 20px;
    }
    #suggestModal.visible { display: flex; }
    .suggest-card {
      width: min(480px, calc(100vw - 32px));
      max-height: calc(100vh - 40px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.28);
      padding: 16px;
    }
    .suggest-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; gap: 10px;
    }
    .suggest-head h3 { margin: 0; font-size: 1rem; }
    .suggest-list { list-style: none; margin: 0; padding: 0; }
    .suggest-list li {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 8px; border-radius: 6px; cursor: pointer;
      border: 1px solid transparent; margin-bottom: 4px;
    }
    .suggest-list li:hover { background: #eef4ff; border-color: #b0c4de; }
    .suggest-id { font-family: monospace; font-weight: bold; font-size: 0.95em; min-width: 6em; }
    .suggest-diff { font-size: 0.8em; color: var(--muted); }
    .suggest-place { font-size: 0.85em; color: var(--text); }
    .suggest-pref { font-size: 0.8em; color: var(--muted); }
    .no-suggest { color: var(--muted); padding: 12px 0; text-align: center; font-size: 0.9em; }
    .suggest-section {
      font-size: 0.78em; color: var(--muted); padding: 4px 8px 2px;
      pointer-events: none; cursor: default;
      border: none; background: none; margin-top: 2px;
    }
    .suggest-sep {
      border: none; border-top: 1px solid var(--line);
      margin: 6px 0; padding: 0; pointer-events: none;
    }

    /* correction count badge */
    #corrBadge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      padding: 0 6px;
      font-size: 0.8em;
      min-width: 1.5em;
      text-align: center;
    }

    /* ── right panel ── */
    #rightPanel {
      flex: 1 1 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #imageWrapper {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }
    #noteImage {
      display: block;
      max-width: 100%;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.1);
    }
    #selCanvas {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      cursor: crosshair;
      border-radius: 8px;
      user-select: none;
      -webkit-user-select: none;
    }
    #selCanvas.active { display: block; }
    #rightPanel .no-image { color: var(--muted); margin-top: 40px; }

    /* ── 範囲選択OCRモーダル ── */
    #selOcrModal {
      position: fixed; bottom: 16px; right: 16px; z-index: 5000;
      display: none;
    }
    #selOcrModal.visible { display: block; }
    .sel-ocr-card {
      width: min(320px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.22);
      padding: 12px;
    }
    .sel-ocr-card h3 { margin: 0 0 8px; font-size: 0.9rem; color: var(--muted); }
    #selOcrRaw {
      width: 100%; margin: 0 0 8px;
      padding: 6px 8px;
      border: 1px solid var(--line); border-radius: 6px;
      font-family: monospace; font-size: 0.9em; line-height: 1.5;
      background: #fafaf7; color: var(--text);
      resize: vertical;
    }
    #selOcrRaw:focus { outline: none; border-color: var(--accent); background: #fff; }
    .sel-ocr-foot { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-sel-ocr {
      padding: 2px 8px;
      border: 1px solid #7a9cc0;
      border-radius: 999px;
      background: #eef4ff;
      color: #234;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .btn-sel-ocr:hover { background: #dce8f8; }
    .btn-sel-ocr.active { background: #b8d4f0; border-color: #4a7caa; }

    /* ── ocr button pill ── */
    .ocr-button {
      padding: 2px 8px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: #fff7f1;
      color: var(--accent);
      font-size: 0.78rem;
      cursor: pointer;
    }
    .ocr-button:hover { background: #ffe8da; }

    /* ── ocr modal ── */
    #ocrModal {
      position: fixed; inset: 0;
      display: none; align-items: center; justify-content: center;
      background: rgba(30,24,18,0.55);
      z-index: 4000; padding: 24px;
    }
    #ocrModal.visible { display: flex; }
    .ocr-modal-card {
      width: min(920px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.28);
      padding: 16px;
    }
    .ocr-modal-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 12px;
    }
    .ocr-modal-head button {
      padding: 6px 10px; border: 1px solid var(--line);
      border-radius: 8px; background: #fff; cursor: pointer;
    }
    #ocrRaw {
      margin: 0; padding: 12px;
      background: #2a241e; color: #f6efe5;
      border-radius: 10px; overflow: auto;
      font-size: 0.82rem; line-height: 1.45;
      white-space: pre-wrap; word-break: break-all;
    }
    .json-nl {
      color: #f0a050;
      background: rgba(240,160,80,0.18);
      border-radius: 2px;
      padding: 0 1px;
    }

    /* ── empty state ── */
    #emptyState { display: none; padding: 40px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
<header>
  <div class="row">
    <strong>OCR 地点番号レビュー</strong>
    <span id="pageCounter"><input id="pageInput" type="text" value="—" title="ページ番号を入力してジャンプ"> <span id="pageTotalLabel">/ —</span></span>
    <button id="btnErrPrev" title="前のエラーへ (Z)">⏪ 前のエラー</button>
    <button id="btnPrev" title="前のページ (A)">◀ 前</button>
    <button id="btnNext" title="次のページ (S)">次 ▶</button>
    <button id="btnErrNext" title="次のエラーへ (X)">次のエラー ⏩</button>
    <label class="toggle">
      <input type="checkbox" id="filterUnmatched">
      未照合ページのみ
    </label>
    <label>バッチ <select id="batchSelect"><option value="">—</option></select></label>
    <span id="status">読み込み中…</span>
    <span style="margin-left:auto">
      <kbd>Z</kbd>/<kbd>X</kbd> 前/次エラー &nbsp;
      <kbd>A</kbd>/<kbd>S</kbd> 前/次 &nbsp;
      <kbd>Enter</kbd> ダウンロード
    </span>
  </div>
  <div class="row">
    <span>修正数: <span id="corrBadge">0</span></span>
    <button id="btnDownload" class="primary">修正をダウンロード</button>
    <button id="btnReset">リセット</button>
    <span id="dlHint" style="color:var(--muted);font-size:0.85em"></span>
  </div>
</header>

<div id="suggestModal">
  <div class="suggest-card">
    <div class="suggest-head">
      <h3 id="suggestTitle">候補</h3>
      <div style="display:flex;gap:6px;align-items:center">
        <button id="suggestCopy" type="button" title="クリップボードにコピー" style="display:flex;align-items:center;padding:4px 6px"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 320 320"><g transform="translate(0,23)"><rect x="48" y="19.210968" width="161.30136" height="161.78903" style="fill:#ffffff;stroke:#000000;stroke-width:32;stroke-miterlimit:4"/><rect x="111.94601" y="87.157021" width="160.10797" height="161.89696" style="fill:#ffffff;stroke:#000000;stroke-width:31.892;stroke-miterlimit:4"/></g></svg></button>
        <button id="suggestClose" type="button">閉じる</button>
      </div>
    </div>
    <ul class="suggest-list" id="suggestList"></ul>
  </div>
</div>

<div class="split">
  <div id="leftPanel">
    <div id="pageInfo"><p style="color:var(--muted)">読み込み中…</p></div>
    <ul id="locList"></ul>
  </div>
  <div id="rightPanel">
    <div class="no-image" id="noImage">ページを選択してください</div>
    <div id="imageWrapper">
      <img id="noteImage" src="" alt="注記カード" crossorigin="anonymous" draggable="false" style="display:none" />
      <canvas id="selCanvas"></canvas>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
      <div id="imageCaption" style="color:var(--muted);font-size:0.84em;text-align:center"></div>
      <button id="btnOcr" type="button" class="ocr-button" style="display:none">OCR 全文</button>
      <button id="btnSelOcr" type="button" class="btn-sel-ocr" style="display:none">範囲選択OCR</button>
    </div>
  </div>
</div>

<div id="selOcrModal">
  <div class="sel-ocr-card">
    <h3 id="selOcrTitle">OCR 結果（編集可）</h3>
    <textarea id="selOcrRaw" rows="8" spellcheck="false"></textarea>
    <div class="sel-ocr-foot">
      <button id="selOcrCancel" type="button">キャンセル</button>
      <button id="selOcrApply" type="button" class="primary">1行1件で追加</button>
    </div>
  </div>
</div>

<div id="ocrModal">
  <div class="ocr-modal-card">
    <div class="ocr-modal-head">
      <strong id="ocrModalTitle">OCR 生データ</strong>
      <button id="ocrModalClose" type="button">閉じる</button>
    </div>
    <pre id="ocrRaw"></pre>
  </div>
</div>

<script>
const DATA_URL = 'data/ocr-review-pages.json';

// ── suggest modal state ──
let suggestTargetKey = null;
let suggestTargetOriginal = null;
let suggestCallback = null; // null = 既存の修正フロー, function = 追加アイテム用コールバック

// Levenshtein distance
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: m + 1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n];
}

function suggestCandidates(original) {
  const prefix2 = original.slice(0, 2);
  const pinned = [];   // 頭2桁一致 & dist=1
  const others = [];   // 頭2桁不一致 & dist=1
  for (const [id, sp] of Object.entries(surveyIndex)) {
    const dist = levenshtein(original, id);
    if (dist < 1 || dist > 1) continue;
    const entry = { id, name: sp.name, pref: sp.pref };
    if (id.startsWith(prefix2)) pinned.push(entry);
    else others.push(entry);
  }
  pinned.sort((a, b) => a.id.localeCompare(b.id));
  others.sort((a, b) => a.id.localeCompare(b.id));
  return { pinned, others };
}

function makeSuggestItem(c) {
  const li = document.createElement('li');
  li.innerHTML = `
    <span class="suggest-id">${escHtml(c.id)}</span>
    <span class="suggest-place">${escHtml(c.name)}</span>
    <span class="suggest-pref">${escHtml(c.pref)}</span>
  `;
  li.title = `クリックで「${c.id}」を修正値に設定`;
  li.addEventListener('click', () => applySuggestion(c.id));
  return li;
}

function openSuggestModal(key, original, callback = null) {
  suggestTargetKey = key;
  suggestTargetOriginal = original;
  suggestCallback = callback;
  document.getElementById('suggestTitle').textContent = `「${original}」の候補（1文字違い）`;
  const list = document.getElementById('suggestList');
  list.innerHTML = '';

  const { pinned, others } = suggestCandidates(original);

  if (!pinned.length && !others.length) {
    list.innerHTML = '<li class="no-suggest">該当する候補がありませんでした</li>';
  } else {
    if (pinned.length) {
      const hdr = document.createElement('li');
      hdr.className = 'suggest-section';
      hdr.textContent = `頭2桁固定（${original.slice(0,2)}xx）`;
      list.appendChild(hdr);
      pinned.forEach(c => list.appendChild(makeSuggestItem(c)));
    }
    if (others.length) {
      const sep = document.createElement('li');
      sep.className = 'suggest-sep';
      list.appendChild(sep);
      const hdr = document.createElement('li');
      hdr.className = 'suggest-section';
      hdr.textContent = '頭2桁を問わず';
      list.appendChild(hdr);
      others.forEach(c => list.appendChild(makeSuggestItem(c)));
    }
  }
  document.getElementById('suggestModal').classList.add('visible');
}

function closeSuggestModal() {
  document.getElementById('suggestModal').classList.remove('visible');
  suggestTargetKey = null;
  suggestTargetOriginal = null;
}

function applySuggestion(id) {
  if (suggestCallback) {
    suggestCallback(id);
  } else if (suggestTargetKey) {
    const input = document.querySelector(`input[data-key="${CSS.escape(suggestTargetKey)}"]`);
    if (input) {
      input.value = id;
      input.dispatchEvent(new Event('change'));
    }
  }
  closeSuggestModal();
}

let allPages = [];
let surveyIndex = {};
let filteredPages = [];
let currentIndex = 0;
let filterUnmatchedOnly = false;

// corrections: key = "batch|source_image|original" → {original, correction, deleted}
const corrections = new Map();
// additions: key = "batch|source_image|+N" → {batch, source_image, correction, comment}
const additions = new Map();
let additionSeq = 0;

function corrKey(batch, source_image, original) {
  return `${batch}|${source_image}|${original}`;
}

function isUnmatched(num) {
  return !surveyIndex[num];
}

function hasUnmatched(page) {
  return page.location_numbers.some(isUnmatched);
}

function rebuildFilteredPages() {
  filteredPages = filterUnmatchedOnly
    ? allPages.filter(hasUnmatched)
    : allPages;
}

function updateStatus() {
  const total = filteredPages.length;
  const idx = total > 0 ? currentIndex + 1 : 0;
  const input = document.getElementById('pageInput');
  if (document.activeElement !== input) input.value = idx;
  document.getElementById('pageTotalLabel').textContent = `/ ${total} ページ`;
  document.getElementById('corrBadge').textContent = String(corrections.size + additions.size);
  // URL ハッシュに現在ページを反映
  if (total > 0) history.replaceState(null, '', `#p${idx}`);
}

function buildImageUrl(serviceId) {
  if (!serviceId) return null;
  const base = serviceId.replace(/\/info\.json$/, '').replace(/\/$/, '');
  return `${base}/full/900,/0/default.jpg`;
}

function renderPage(page) {
  if (!page) return;

  // バッチセレクトを現在のバッチに同期
  const batchSelect = document.getElementById('batchSelect');
  if (batchSelect.value !== page.batch) batchSelect.value = page.batch;

  // ── left: page info ──
  const infoEl = document.getElementById('pageInfo');
  const mapNums = (page.source_map_numbers || []);
  const mapLinksHtml = mapNums.map(n =>
    `<a href="calibration-preview.html?map=LAJ_${escHtml(n)}" target="_blank" rel="noopener">LAJ_${escHtml(n)}</a>`
  ).join('');
  infoEl.innerHTML = `
    <h2>${escHtml(page.source_title || page.source_ljc_id || '')}</h2>
    <div class="meta">
      <div>バッチ: <strong>${escHtml(page.batch)}</strong></div>
      <div>ページ: <strong>${escHtml(page.source_image)}</strong> (カード ${escHtml(String(page.source_canvas_label ?? '?'))})</div>
      <div><code style="font-size:0.82em">${escHtml(page.source_ljc_id || '')}</code></div>
    </div>
    ${mapLinksHtml ? `<div class="map-links">${mapLinksHtml}</div>` : ''}
  `;

  // ── left: location numbers ──
  const listEl = document.getElementById('locList');
  listEl.innerHTML = '';
  if (!page.location_numbers.length) {
    listEl.innerHTML = '<li style="color:var(--muted)">地点番号なし</li>';
  } else {
    for (const num of page.location_numbers) {
      const unmatched = isUnmatched(num);
      const li = document.createElement('li');
      li.className = unmatched ? 'loc-unmatched' : 'loc-matched';

      const key = corrKey(page.batch, page.source_image, num);
      const existing = corrections.get(key);

      const idSpan = document.createElement('span');
      idSpan.className = 'loc-id ' + (unmatched ? 'unmatched' : 'matched');
      idSpan.textContent = num;

      if (!unmatched) {
        // ── 緑カード：ヘッダ行（番号 + 修正ボタン）──
        const sp = surveyIndex[num];
        const head = document.createElement('div');
        head.className = 'loc-matched-head';
        head.appendChild(idSpan);
        const btnEdit = document.createElement('button');
        btnEdit.type = 'button';
        btnEdit.className = 'btn-edit-matched';
        btnEdit.textContent = existing ? '修正中' : '修正';
        head.appendChild(btnEdit);
        li.appendChild(head);

        const placeEl = document.createElement('div');
        placeEl.className = 'loc-place';
        placeEl.textContent = sp ? `${sp.pref} ${sp.name}` : '';
        li.appendChild(placeEl);

        // 折りたたみ編集エリア
        const editArea = document.createElement('div');
        editArea.className = 'loc-matched-edit' + (existing ? ' open' : '');
        editArea.appendChild(buildEditSection(key, page, num, existing));
        li.appendChild(editArea);

        btnEdit.addEventListener('click', () => {
          const open = editArea.classList.toggle('open');
          btnEdit.textContent = open ? '閉じる' : (corrections.get(key) ? '修正中' : '修正');
        });
      } else {
        li.appendChild(idSpan);
        appendEditSection(li, key, page, num, existing);
      }

      listEl.appendChild(li);
    }
  }

  // ── 既存の追加アイテムを復元 ──
  for (const [addKey, add] of additions) {
    if (add.batch === page.batch && add.source_image === page.source_image) {
      listEl.appendChild(makeAdditionItem(addKey, page.batch, page.source_image, add));
    }
  }

  // ── 追加ボタン ──
  const btnAdd = document.createElement('button');
  btnAdd.type = 'button';
  btnAdd.className = 'btn-add-loc';
  btnAdd.textContent = '＋ 地点番号を追加';
  btnAdd.addEventListener('click', () => openSelOcrModal('', page, '地点番号を追加（1行1件）'));
  listEl.appendChild(btnAdd);

  // ── right: image ──
  const imgEl = document.getElementById('noteImage');
  const noImgEl = document.getElementById('noImage');
  const captionEl = document.getElementById('imageCaption');
  const ocrBtn = document.getElementById('btnOcr');
  const url = buildImageUrl(page.source_service_id);
  if (url) {
    imgEl.src = url;
    imgEl.style.display = '';
    noImgEl.style.display = 'none';
    captionEl.textContent = `${page.source_image} — カード ${page.source_canvas_label ?? '?'}`;
  } else {
    imgEl.style.display = 'none';
    noImgEl.style.display = '';
    captionEl.textContent = '';
  }
  ocrBtn.style.display = '';
  ocrBtn.onclick = () => openOcrModal(page);
  const selOcrBtn = document.getElementById('btnSelOcr');
  selOcrBtn.style.display = '';
  selOcrBtn.onclick = () => toggleSelectionMode(page);

  updateStatus();
}

function goTo(idx) {
  if (!filteredPages.length) return;
  currentIndex = Math.max(0, Math.min(filteredPages.length - 1, idx));
  renderPage(filteredPages[currentIndex]);
}

function goToError(dir) {
  if (!filteredPages.length) return;
  let idx = currentIndex + dir;
  while (idx >= 0 && idx < filteredPages.length) {
    if (hasUnmatched(filteredPages[idx])) { goTo(idx); return; }
    idx += dir;
  }
}

function onInputChange(e) {
  const { key, batch, sourceImage, original } = e.target.dataset;
  const val = e.target.value.trim();
  if (val === original) {
    corrections.delete(key);
    e.target.classList.remove('corrected', 'deleted');
  } else {
    const prev = corrections.get(key) || {};
    corrections.set(key, { batch, source_image: sourceImage, original, correction: val, deleted: false, comment: prev.comment || '' });
    e.target.classList.remove('deleted');
    e.target.classList.add('corrected');
    e.target.disabled = false;
  }
  updateStatus();
  // update lookup hint
  const li = e.target.closest('li');
  let hint = li.querySelector('.loc-place');
  if (!hint) { hint = document.createElement('div'); hint.className = 'loc-place'; li.appendChild(hint); }
  if (val && surveyIndex[val]) {
    const sp = surveyIndex[val];
    hint.textContent = `→ ${sp.pref} ${sp.name}`;
  } else if (val && !surveyIndex[val]) {
    hint.textContent = '（未照合）';
    hint.style.color = 'var(--unmatched)';
  } else {
    hint.textContent = '';
  }
}

// 編集UI（input + 候補 + 削除 + textarea）を fragment で返す
function buildEditSection(key, page, num, existing) {
  const frag = document.createDocumentFragment();

  const editRow = document.createElement('div');
  editRow.className = 'loc-edit-row';

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = '修正値（空=削除）';
  input.dataset.key = key;
  input.dataset.batch = page.batch;
  input.dataset.sourceImage = page.source_image;
  input.dataset.original = num;

  if (existing) {
    if (existing.deleted) {
      input.value = '';
      input.classList.add('deleted');
      input.disabled = true;
    } else {
      input.value = existing.correction;
      input.classList.add('corrected');
    }
  } else {
    input.value = num;
  }
  input.addEventListener('change', onInputChange);
  input.addEventListener('input', onInputChange);

  const btnSuggest = document.createElement('button');
  btnSuggest.type = 'button';
  btnSuggest.className = 'btn-suggest';
  btnSuggest.textContent = '候補';
  btnSuggest.dataset.key = key;
  btnSuggest.dataset.original = num;
  btnSuggest.addEventListener('click', e => openSuggestModal(e.target.dataset.key, e.target.dataset.original));

  const btnDel = document.createElement('button');
  btnDel.type = 'button';
  btnDel.className = 'btn-delete' + (existing?.deleted ? ' active' : '');
  btnDel.textContent = existing?.deleted ? '削除済' : '削除';
  btnDel.dataset.key = key;
  btnDel.dataset.batch = page.batch;
  btnDel.dataset.sourceImage = page.source_image;
  btnDel.dataset.original = num;
  btnDel.addEventListener('click', onDeleteClick);

  editRow.appendChild(input);
  editRow.appendChild(btnSuggest);
  editRow.appendChild(btnDel);
  frag.appendChild(editRow);

  const textarea = document.createElement('textarea');
  textarea.className = 'loc-comment' + (existing?.comment ? ' has-comment' : '');
  textarea.placeholder = 'コメント（任意）';
  textarea.dataset.key = key;
  textarea.dataset.batch = page.batch;
  textarea.dataset.sourceImage = page.source_image;
  textarea.dataset.original = num;
  textarea.value = existing?.comment || '';
  textarea.addEventListener('input', onCommentChange);
  frag.appendChild(textarea);

  if (existing && !existing.deleted && surveyIndex[existing.correction]) {
    const hint = document.createElement('div');
    hint.className = 'loc-place';
    const sp = surveyIndex[existing.correction];
    hint.textContent = `→ ${sp.pref} ${sp.name}`;
    frag.appendChild(hint);
  }
  return frag;
}

function appendEditSection(parent, key, page, num, existing) {
  parent.appendChild(buildEditSection(key, page, num, existing));
}

function makeAdditionItem(addKey, batch, source_image, existing = null) {
  const li = document.createElement('li');
  li.className = 'loc-added';
  li.dataset.addKey = addKey;

  const label = document.createElement('span');
  label.className = 'loc-id';
  label.textContent = '＋追加';
  li.appendChild(label);

  const editRow = document.createElement('div');
  editRow.className = 'loc-edit-row';

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = '追加する地点番号';
  input.value = existing?.correction || '';
  if (existing?.correction) input.classList.add('corrected');
  input.addEventListener('input', e => {
    const val = e.target.value.trim();
    const prev = additions.get(addKey) || { batch, source_image, correction: '', comment: '' };
    additions.set(addKey, { ...prev, correction: val });
    input.classList.toggle('corrected', val.length > 0);
    // 地名ヒント更新
    let hint = li.querySelector('.loc-place');
    if (!hint) { hint = document.createElement('div'); hint.className = 'loc-place'; li.appendChild(hint); }
    if (val && surveyIndex[val]) {
      const sp = surveyIndex[val];
      hint.textContent = `${sp.pref} ${sp.name}`;
      hint.style.color = '';
    } else if (val) {
      hint.textContent = '（未照合）';
      hint.style.color = 'var(--unmatched)';
    } else {
      hint.textContent = '';
    }
    updateStatus();
  });

  const btnSuggest = document.createElement('button');
  btnSuggest.type = 'button';
  btnSuggest.className = 'btn-suggest';
  btnSuggest.textContent = '候補';
  btnSuggest.addEventListener('click', () => {
    const val = input.value.trim() || '';
    if (val) {
      openSuggestModal(null, val, id => { input.value = id; input.dispatchEvent(new Event('input')); });
    }
  });

  const btnRemove = document.createElement('button');
  btnRemove.type = 'button';
  btnRemove.className = 'btn-delete';
  btnRemove.textContent = '削除';
  btnRemove.addEventListener('click', () => {
    additions.delete(addKey);
    li.remove();
    updateStatus();
  });

  editRow.appendChild(input);
  editRow.appendChild(btnSuggest);
  editRow.appendChild(btnRemove);
  li.appendChild(editRow);

  const textarea = document.createElement('textarea');
  textarea.className = 'loc-comment' + (existing?.comment ? ' has-comment' : '');
  textarea.placeholder = 'コメント（任意）';
  textarea.value = existing?.comment || '';
  textarea.addEventListener('input', e => {
    const prev = additions.get(addKey) || { batch, source_image, correction: '', comment: '' };
    additions.set(addKey, { ...prev, comment: e.target.value });
    e.target.classList.toggle('has-comment', e.target.value.length > 0);
    updateStatus();
  });
  li.appendChild(textarea);

  if (existing?.correction && surveyIndex[existing.correction]) {
    const hint = document.createElement('div');
    hint.className = 'loc-place';
    const sp = surveyIndex[existing.correction];
    hint.textContent = `${sp.pref} ${sp.name}`;
    li.appendChild(hint);
  }

  return li;
}

function onCommentChange(e) {
  const { key, batch, sourceImage, original } = e.target.dataset;
  const comment = e.target.value;
  const prev = corrections.get(key) || { batch, source_image: sourceImage, original, correction: original, deleted: false };
  corrections.set(key, { ...prev, comment });
  e.target.classList.toggle('has-comment', comment.length > 0);
  updateStatus();
}

function onDeleteClick(e) {
  const { key, batch, sourceImage, original } = e.target.dataset;
  const existing = corrections.get(key);
  if (existing?.deleted) {
    // toggle off
    corrections.delete(key);
    e.target.classList.remove('active');
    e.target.textContent = '削除';
    const input = document.querySelector(`input[data-key="${CSS.escape(key)}"]`);
    if (input) { input.disabled = false; input.value = original; input.classList.remove('deleted', 'corrected'); }
  } else {
    const prev2 = corrections.get(key) || {};
    corrections.set(key, { batch, source_image: sourceImage, original, correction: null, deleted: true, comment: prev2.comment || '' });
    e.target.classList.add('active');
    e.target.textContent = '削除済';
    const input = document.querySelector(`input[data-key="${CSS.escape(key)}"]`);
    if (input) { input.disabled = true; input.value = ''; input.classList.add('deleted'); input.classList.remove('corrected'); }
  }
  updateStatus();
}

function downloadCorrections() {
  if (!corrections.size) {
    document.getElementById('dlHint').textContent = '修正がありません';
    setTimeout(() => { document.getElementById('dlHint').textContent = ''; }, 2000);
    return;
  }
  const out = [
    ...Array.from(corrections.values()).map(c => ({
      batch: c.batch,
      source_image: c.source_image,
      original: c.original,
      correction: c.deleted ? null : c.correction,
      ...(c.comment ? { comment: c.comment } : {}),
    })),
    ...Array.from(additions.values())
      .filter(a => a.correction)
      .map(a => ({
        batch: a.batch,
        source_image: a.source_image,
        original: null,
        correction: a.correction,
        ...(a.comment ? { comment: a.comment } : {}),
      })),
  ];
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ocr-corrections.json';
  a.click();
  document.getElementById('dlHint').textContent = `${out.length}件をダウンロードしました`;
  setTimeout(() => { document.getElementById('dlHint').textContent = ''; }, 3000);
}

function resetCorrections() {
  if (corrections.size === 0) return;
  const total = corrections.size + additions.size;
  if (!confirm(`${total}件の修正・追加をリセットしますか？`)) return;
  corrections.clear();
  additions.clear();
  renderPage(filteredPages[currentIndex]);
}

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function init() {
  const res = await fetch(DATA_URL);
  if (!res.ok) throw new Error(`データ読み込み失敗: ${res.status}`);
  const data = await res.json();

  allPages = data.pages || [];
  surveyIndex = data.surveyIndex || {};
  filterUnmatchedOnly = document.getElementById('filterUnmatched').checked;
  rebuildFilteredPages();

  // バッチセレクト構築
  const batchSelect = document.getElementById('batchSelect');
  const batches = data.batches || [];
  batches.forEach(b => {
    const opt = document.createElement('option');
    opt.value = b;
    const batchPages = allPages.filter(p => p.batch === b);
    const total = batchPages.length;
    const errCount = batchPages.filter(hasUnmatched).length;
    const zeroCount = batchPages.filter(p => p.location_numbers.length === 0).length;
    opt.textContent = `${b}  (${total}p / 未照合${errCount} / 0件${zeroCount})`;
    batchSelect.appendChild(opt);
  });
  batchSelect.addEventListener('change', () => {
    const batch = batchSelect.value;
    if (!batch) return;
    const idx = filteredPages.findIndex(p => p.batch === batch);
    if (idx >= 0) goTo(idx);
  });

  const unmatchedPageCount = allPages.filter(hasUnmatched).length;
  document.getElementById('status').textContent =
    `${data.batches?.length ?? 0}バッチ / ${allPages.length}ページ / 未照合ページ${unmatchedPageCount}件`;

  // URL ハッシュ (#p123) から初期ページを復元
  const hashMatch = window.location.hash.match(/^#p(\d+)$/);
  const initPage = hashMatch ? parseInt(hashMatch[1], 10) - 1 : 0;
  if (filteredPages.length) goTo(Math.min(initPage, filteredPages.length - 1));
  else document.getElementById('status').textContent += ' — 未照合ページなし';
}

// ── 範囲選択OCR ──
let selectionMode = false;
let selCurrentPage = null;
let tesseractWorker = null;
let tesseractReady = false;

const LOC_NUM_RE = /\b(\d{3,4}[.,]\d{1,2})\b/g;

function extractNums(text) {
  const found = [];
  const seen = new Set();
  for (const m of text.matchAll(LOC_NUM_RE)) {
    const n = m[1].replace(',', '.');
    if (!seen.has(n)) { seen.add(n); found.push(n); }
  }
  return found;
}

async function ensureTesseract() {
  if (tesseractReady) return tesseractWorker;
  const btn = document.getElementById('btnSelOcr');
  const prevText = btn.textContent;
  btn.textContent = '初期化中…';
  btn.disabled = true;
  tesseractWorker = await Tesseract.createWorker('eng', 1, {
    workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js',
    corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5/tesseract-core.wasm.js',
  });
  await tesseractWorker.setParameters({ tessedit_char_whitelist: '0123456789.,' });
  tesseractReady = true;
  btn.textContent = prevText;
  btn.disabled = false;
  return tesseractWorker;
}

function toggleSelectionMode(page) {
  const canvas = document.getElementById('selCanvas');
  const btn = document.getElementById('btnSelOcr');
  selectionMode = !selectionMode;
  selCurrentPage = page;
  canvas.classList.toggle('active', selectionMode);
  btn.classList.toggle('active', selectionMode);
  btn.textContent = selectionMode ? 'キャンセル' : '範囲選択OCR';
  if (selectionMode) { syncCanvas(); ensureTesseract(); }
}

function exitSelectionMode() {
  selectionMode = false;
  const canvas = document.getElementById('selCanvas');
  const btn = document.getElementById('btnSelOcr');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  canvas.classList.remove('active');
  btn.classList.remove('active');
  btn.textContent = '範囲選択OCR';
}

// canvas サイズを画像に合わせる
function syncCanvas() {
  const img = document.getElementById('noteImage');
  const canvas = document.getElementById('selCanvas');
  canvas.width = img.offsetWidth;
  canvas.height = img.offsetHeight;
}

// ドラッグ選択
let dragStart = null;
const selCanvas = document.getElementById('selCanvas');

selCanvas.addEventListener('mousedown', e => {
  if (!selectionMode) return;
  e.preventDefault();
  syncCanvas();
  const r = selCanvas.getBoundingClientRect();
  dragStart = { x: e.clientX - r.left, y: e.clientY - r.top };
});

selCanvas.addEventListener('mousemove', e => {
  if (!selectionMode || !dragStart) return;
  const r = selCanvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const ctx = selCanvas.getContext('2d');
  ctx.clearRect(0, 0, selCanvas.width, selCanvas.height);
  ctx.fillStyle = 'rgba(58,120,200,0.12)';
  ctx.strokeStyle = 'rgba(58,120,200,0.85)';
  ctx.lineWidth = 1.5;
  const rx = Math.min(dragStart.x, x), ry = Math.min(dragStart.y, y);
  const rw = Math.abs(x - dragStart.x), rh = Math.abs(y - dragStart.y);
  ctx.fillRect(rx, ry, rw, rh);
  ctx.strokeRect(rx, ry, rw, rh);
});

selCanvas.addEventListener('mouseup', async e => {
  if (!selectionMode || !dragStart) return;
  const r = selCanvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const rx = Math.min(dragStart.x, x), ry = Math.min(dragStart.y, y);
  const rw = Math.abs(x - dragStart.x), rh = Math.abs(y - dragStart.y);
  dragStart = null;
  if (rw < 5 || rh < 5) return;

  // 画像の実サイズ → 表示サイズ倍率
  const img = document.getElementById('noteImage');
  const scaleX = img.naturalWidth / img.offsetWidth;
  const scaleY = img.naturalHeight / img.offsetHeight;

  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = Math.round(rw * scaleX);
  tmpCanvas.height = Math.round(rh * scaleY);
  const tc = tmpCanvas.getContext('2d');
  tc.drawImage(img,
    Math.round(rx * scaleX), Math.round(ry * scaleY),
    tmpCanvas.width, tmpCanvas.height,
    0, 0, tmpCanvas.width, tmpCanvas.height
  );

  exitSelectionMode();

  const btn = document.getElementById('btnSelOcr');
  btn.textContent = 'OCR中…';
  btn.disabled = true;
  btn.style.display = '';

  try {
    const worker = await ensureTesseract();
    const { data: { text } } = await worker.recognize(tmpCanvas);
    openSelOcrModal(text.trim(), selCurrentPage);
  } catch(err) {
    alert('OCRエラー: ' + err.message);
  } finally {
    btn.textContent = '範囲選択OCR';
    btn.disabled = false;
  }
});

function openSelOcrModal(rawText, page, title = 'OCR 結果（編集可）') {
  const ta = document.getElementById('selOcrRaw');
  ta.value = rawText || '';
  document.getElementById('selOcrTitle').textContent = title;
  document.getElementById('selOcrModal').classList.add('visible');
  ta.focus();
  document.getElementById('selOcrApply').onclick = () => applySelOcr(page);
}

function closeSelOcrModal() {
  document.getElementById('selOcrModal').classList.remove('visible');
}

function applySelOcr(page) {
  const lines = document.getElementById('selOcrRaw').value
    .split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const listEl = document.getElementById('locList');
  const btnAdd = listEl.querySelector('.btn-add-loc');
  lines.forEach(val => {
    const addKey = `${page.batch}|${page.source_image}|+${++additionSeq}`;
    additions.set(addKey, { batch: page.batch, source_image: page.source_image, correction: val, comment: '' });
    const item = makeAdditionItem(addKey, page.batch, page.source_image, { correction: val, comment: '' });
    if (btnAdd) btnAdd.before(item);
    else listEl.appendChild(item);
  });
  updateStatus();
  closeSelOcrModal();
}

document.getElementById('selOcrCancel').addEventListener('click', closeSelOcrModal);

// ── OCR modal ──
function openOcrModal(page) {
  document.getElementById('ocrModalTitle').textContent =
    `OCR 生データ: ${page.source_title || page.source_ljc_id || page.source_image}`;
  const raw = JSON.stringify(page, null, 2);
  // HTML エスケープ → \n（文字列内エスケープ）を色付き + 実改行に置換
  const html = raw
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\\n/g, '<span class="json-nl">\\n</span>\n');
  document.getElementById('ocrRaw').innerHTML = html;
  document.getElementById('ocrModal').classList.add('visible');
}
function closeOcrModal() {
  document.getElementById('ocrModal').classList.remove('visible');
}
document.getElementById('ocrModalClose').addEventListener('click', closeOcrModal);
document.getElementById('ocrModal').addEventListener('click', e => {
  if (e.target === document.getElementById('ocrModal')) closeOcrModal();
});

// ── event handlers ──
document.getElementById('suggestClose').addEventListener('click', closeSuggestModal);
document.getElementById('suggestCopy').addEventListener('click', () => {
  const { pinned, others } = suggestCandidates(suggestTargetOriginal || '');
  const lines = [`「${suggestTargetOriginal}」の候補`];
  if (pinned.length) {
    lines.push(`[頭2桁固定]`);
    pinned.forEach(c => lines.push(`${c.id}\t${c.pref} ${c.name}`));
  }
  if (others.length) {
    lines.push(`[頭2桁を問わず]`);
    others.forEach(c => lines.push(`${c.id}\t${c.pref} ${c.name}`));
  }
  if (!pinned.length && !others.length) lines.push('（該当なし）');
  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    const btn = document.getElementById('suggestCopy');
    const orig = btn.innerHTML;
    btn.innerHTML = '✓';
    setTimeout(() => { btn.innerHTML = orig; }, 1500);
  });
});
document.getElementById('suggestModal').addEventListener('click', e => {
  if (e.target === document.getElementById('suggestModal')) closeSuggestModal();
});

document.getElementById('filterUnmatched').addEventListener('change', e => {
  filterUnmatchedOnly = e.target.checked;
  rebuildFilteredPages();
  // try to keep roughly the same position
  goTo(Math.min(currentIndex, filteredPages.length - 1));
});
// ── ページ入力ジャンプ ──
const pageInput = document.getElementById('pageInput');
pageInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const n = parseInt(pageInput.value, 10);
    if (!isNaN(n)) goTo(n - 1);
    pageInput.blur();
  } else if (e.key === 'Escape') {
    updateStatus(); // 値を元に戻す
    pageInput.blur();
  }
});
pageInput.addEventListener('focus', () => pageInput.select());

document.getElementById('btnErrPrev').addEventListener('click', () => goToError(-1));
document.getElementById('btnErrNext').addEventListener('click', () => goToError(1));
document.getElementById('btnPrev').addEventListener('click', () => goTo(currentIndex - 1));
document.getElementById('btnNext').addEventListener('click', () => goTo(currentIndex + 1));
document.getElementById('btnDownload').addEventListener('click', downloadCorrections);
document.getElementById('btnReset').addEventListener('click', resetCorrections);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('selOcrModal').classList.contains('visible')) { closeSelOcrModal(); return; }
    if (document.getElementById('ocrModal').classList.contains('visible')) { closeOcrModal(); return; }
    if (selectionMode) { exitSelectionMode(); return; }
    closeSuggestModal(); return;
  }
  if (document.getElementById('suggestModal').classList.contains('visible')) return;
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === 'z' || e.key === 'Z') goToError(-1);
  else if (e.key === 'x' || e.key === 'X') goToError(1);
  else if (e.key === 'a' || e.key === 'A') goTo(currentIndex - 1);
  else if (e.key === 's' || e.key === 'S') goTo(currentIndex + 1);
  else if (e.key === 'Enter') downloadCorrections();
});

init().catch(e => {
  console.error(e);
  document.getElementById('status').textContent = `エラー: ${e.message}`;
});
</script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
