<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>IIIF overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    header { padding: 8px 12px; background: #f6f6f6; border-bottom: 1px solid #ddd; position: relative; z-index: 10; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:6px 0; }
    select { padding:4px 6px; max-width:320px; }
    input[type="range"] { width:300px; }
    input[type="number"] { width:64px; }
    button { padding:6px 10px; }
    #stage-clip { position: relative; height: calc(100vh - 190px); overflow: hidden; }
    #stage { position: absolute; inset: 0; }
    #mapBase, #mapOverlay {
      position: absolute; inset: 0; /* 重ねる */
    }
    /* 上の地図は操作させず、クリックは下へ透過 */
    #mapOverlay { pointer-events: none; }
    code { background:#eee; padding:2px 4px; border-radius:4px; }
    kbd  { background:#eee; border:1px solid #bbb; border-radius:3px; padding:1px 4px; font-size:0.9em; }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <label>下（ベース）</label>
      <select id="selectBase"><option value="">-- 候補を読み込み中 --</option></select>
      <label>上（オーバーレイ）</label>
      <select id="selectOverlay"><option value="">-- 候補を読み込み中 --</option></select>
      <a id="noteViewerLink" href="notes-viewer.html" target="_blank" rel="noopener">注記ビューア</a>
    </div>
    <div class="row">
      <label>ブレンド</label>
      <input id="blend" type="range" min="0" max="1" step="0.01" value="0.5">
      <span><code id="labelBase">LAJ_018</code>: <b id="valBase">0.50</b></span>
      <span><code id="labelOverlay">LAJ_019</code>: <b id="valOverlay">0.50</b></span>
    </div>
    <div class="row">
      <label>調整幅（px）</label>
      <input id="step" type="number" value="2" min="1" step="1">
      <button id="nUp">↑</button>
      <button id="nLeft">←</button>
      <button id="nRight">→</button>
      <button id="nDown">↓</button>
      <button id="resetOffset" title="オーバーレイの平行移動をリセット">位置リセット</button>
      <label><input id="tintBase" type="checkbox"> 左図を赤色調</label>
      <label><input id="rotateAlign" type="checkbox"> 経緯線を水平垂直に補正</label>
    </div>
    <div class="row">
      <label>キャリブレーション</label>
      <span>記録: <b id="pointCount">0</b>点</span>
      <button id="recordPoint">記録</button>
      <button id="undoPoint">1個戻す</button>
      <button id="clearPoints">クリア</button>
      <button id="downloadJson">ダウンロード</button>
      <small id="lastRecorded" style="color:#666"></small>
      <span style="margin-left:auto; color:#888; font-size:0.82em; white-space:nowrap">
        <kbd>Space↑</kbd> 記録 &nbsp;
        <kbd>Backspace</kbd> 1個戻す &nbsp;
        <kbd>Shift</kbd>+<kbd>Backspace</kbd> クリア &nbsp;
        <kbd>Esc</kbd> 地図へ戻る &nbsp;
        <kbd>Enter</kbd> DL &nbsp;
        <kbd>A</kbd>/<kbd>S</kbd> 前/次 &nbsp;
        <kbd>←→↑↓</kbd> 移動 &nbsp;
        <kbd>Shift</kbd> ブレンド切替 &nbsp;
        <kbd>Z</kbd>/<kbd>X</kbd> 点チェック前/次
      </span>
    </div>
    <div class="row">
      <label>点チェック</label>
      <span id="checkStatus" style="color:#666; min-width:6em"></span>
      <small id="checkCoords" style="color:#888"></small>
    </div>
  </header>

  <div id="stage-clip">
    <div id="stage">
      <div id="mapBase" tabindex="0"></div>
      <div id="mapOverlay"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-iiif@3.0.0/leaflet-iiif.min.js"></script>
  <script src="scripts/iiif-utils.js"></script>
  <script src="scripts/note-sync.js"></script>
<script>

  // ===== 候補リストの読み込み =====
  let mapCandidates = [];

  const defaultBase = 'LAJ_017';
  const defaultOverlay = 'LAJ_018';
  const defaultCheckJson = 'data/LAJ_017_LAJ_027.json';
  const noteBroadcaster = createLajNoteBroadcaster(() => ({
    page: 'overlay',
    mapId: $('selectOverlay')?.value?.trim() || defaultOverlay,
    baseId: $('selectBase')?.value?.trim() || defaultBase,
    overlayId: $('selectOverlay')?.value?.trim() || defaultOverlay,
    ocrSet: noteOcrSetForMapId($('selectOverlay')?.value?.trim() || defaultOverlay),
  }));

  function noteOcrSetForMapId(id) {
    const n = extractLajMapNumber(id);
    if (n && ['017', '018', '019'].includes(n)) return '017-019';
    return null;
  }

  function updateNoteViewerLink() {
    const id = $('selectOverlay')?.value?.trim() || defaultOverlay;
    const set = noteOcrSetForMapId(id);
    $('noteViewerLink').href = set ? `notes-viewer.html?set=${encodeURIComponent(set)}` : 'notes-viewer.html';
  }

  async function loadCandidates() {
    try {
      const res = await fetch('data/laj_maps.json');
      mapCandidates = await res.json();
      populateSelect($('selectBase'), mapCandidates, defaultBase);
      populateSelect($('selectOverlay'), mapCandidates, defaultOverlay);
      // 候補ロード後に初回画像ロード
      loadPair().catch(e => console.error('初回loadPair失敗:', e));
    } catch (e) {
      console.error('候補リストの読み込みに失敗:', e);
      $('selectBase').innerHTML = '<option value="">-- 読み込み失敗 --</option>';
      $('selectOverlay').innerHTML = '<option value="">-- 読み込み失敗 --</option>';
    }
  }

  function populateSelect(selectEl, items, currentValue) {
    selectEl.innerHTML = '<option value="">-- 選択してください --</option>';
    items.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.id;
      opt.textContent = `${item.id}: ${item.title}`;
      if (item.id === currentValue) opt.selected = true;
      selectEl.appendChild(opt);
    });
  }

  // 初回読み込み
  loadCandidates();
  // 点チェック JSON を規定パスから自動読み込み（失敗は無視）
  fetchCheckPoints(defaultCheckJson, /*silent=*/true);

  // キャリブレーション記録（loadPair より前に定義）
  let calibrationPoints = [];

  // ===== 2つの地図（ベース／オーバーレイ） =====
  const mapBase    = L.map('mapBase',    { crs: L.CRS.Simple, center:[0,0], zoom:0, keyboard:false });
  const mapOverlay = L.map('mapOverlay', { crs: L.CRS.Simple, center:[0,0], zoom:0,
    zoomControl:false, attributionControl:false
  });

  function focusMapInteraction() {
    const active = document.activeElement;
    if (active && typeof active.blur === 'function' && active !== document.body) active.blur();
    mapBase.getContainer().focus({ preventScroll: true });
  }

  // ベースの動きにオーバーレイを追従
  function syncOverlayView() {
    mapOverlay.setView(mapBase.getCenter(), mapBase.getZoom(), { animate:false });
  }
  mapBase.on("move zoom", syncOverlayView);

  let layerBase = null, layerOverlay = null;

  // ===== ブレンド（合計=1） =====
  function applyBlend(v) {
    if (layerBase)    layerBase.setOpacity(v);
    if (layerOverlay) layerOverlay.setOpacity(1 - v);
    $('blend').value = v;
    $('valBase').textContent = v.toFixed(2);
    $('valOverlay').textContent = (1 - v).toFixed(2);
  }
  $('blend').addEventListener('input', (e) => applyBlend(parseFloat(e.target.value)));

  // Shift でブレンドを A(0.7) / B(0.3) にアニメーション移動
  const BLEND_A = 0.7, BLEND_B = 0.3, BLEND_DURATION = 300;
  let blendAnim = null;
  function animateBlend(target) {
    if (blendAnim) cancelAnimationFrame(blendAnim);
    const start = parseFloat($('blend').value);
    if (Math.abs(target - start) < 0.001) return;
    const t0 = performance.now();
    function step(now) {
      const t = Math.min((now - t0) / BLEND_DURATION, 1);
      const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t; // ease-in-out
      applyBlend(start + (target - start) * ease);
      if (t < 1) blendAnim = requestAnimationFrame(step);
    }
    blendAnim = requestAnimationFrame(step);
  }

  // ===== オーバーレイの平行移動（mapOverlay コンテナに transform を当てる） =====
  // offset は「最大ズーム時のピクセル数」として保存し、現在のズームに応じてスケーリング
  let overlayOffset = { x: 0, y: 0 }; // 最大ズーム基準の px
  function applyOverlayOffset() {
    const el = $('mapOverlay');
    const maxZoom = mapBase.getMaxZoom();
    const currentZoom = mapBase.getZoom();
    const scale = Math.pow(2, currentZoom - maxZoom);
    const scaledX = overlayOffset.x * scale;
    const scaledY = overlayOffset.y * scale;
    el.style.transform = `translate(${scaledX}px, ${scaledY}px)`;
  }
  // ズーム変更時にも offset を再適用
  mapBase.on('zoom', applyOverlayOffset);

  const step = () => parseInt($('step').value || '1', 10);
  // 矢印ボタンは「最大ズーム基準」で offset を更新
  const ALIGN_DEG = -18.92;
  const ALIGN_RAD = ALIGN_DEG * Math.PI / 180; // ステージ回転角（CSS rotate と同値）
  const ALIGN_COS = Math.abs(Math.cos(ALIGN_RAD));
  const ALIGN_SIN = Math.abs(Math.sin(ALIGN_RAD));
  function adjustOffset(dx, dy) {
    if ($('rotateAlign').checked) {
      // スクリーン座標系でのdx,dyをコンテナ座標系に逆変換
      const c = Math.cos(ALIGN_RAD), s = Math.sin(ALIGN_RAD);
      [dx, dy] = [dx * c + dy * s, -dx * s + dy * c];
    }
    const maxZoom = mapBase.getMaxZoom();
    const currentZoom = mapBase.getZoom();
    const scale = Math.pow(2, currentZoom - maxZoom);
    overlayOffset.x += dx / scale;
    overlayOffset.y += dy / scale;
    applyOverlayOffset();
  }
  // 押しっぱなしで連続移動（初回 300ms 後、以降 50ms 間隔）
  function holdButton(el, dx, dy) {
    let timer;
    function fire() { adjustOffset(dx(), dy()); }
    function start() {
      fire();
      timer = setTimeout(() => { fire(); timer = setInterval(fire, 50); }, 300);
    }
    function stop() { clearTimeout(timer); clearInterval(timer); }
    el.addEventListener('mousedown',   start);
    el.addEventListener('mouseup',     stop);
    el.addEventListener('mouseleave',  stop);
    el.addEventListener('touchstart',  e => { e.preventDefault(); start(); }, { passive: false });
    el.addEventListener('touchend',    stop);
    el.addEventListener('touchcancel', stop);
  }
  holdButton($('nUp'),    () => 0,       () => -step());
  holdButton($('nDown'),  () => 0,       () =>  step());
  holdButton($('nLeft'),  () => -step(), () => 0);
  holdButton($('nRight'), () =>  step(), () => 0);
  $('resetOffset').addEventListener('click', () => { overlayOffset = {x:0,y:0}; applyOverlayOffset(); });

  function navigateOverlay(delta) {
    const sel = $('selectOverlay');
    const idx = mapCandidates.findIndex(c => c.id === sel.value);
    if (idx < 0) return;
    const next = idx + delta;
    if (next < 0 || next >= mapCandidates.length) return;
    if (calibrationPoints.length > 0) {
      if (!confirm(`${calibrationPoints.length}点の記録が失われます。続けますか？`)) return;
    }
    sel.value = mapCandidates[next].id;
    onSelectChange();
  }

  // ===== 点チェック =====
  let checkPoints = [];
  let checkIndex  = -1;

  function updateCheckStatus() {
    if (!checkPoints.length) {
      $('checkStatus').textContent = '';
      $('checkCoords').textContent = '';
      return;
    }
    const pt = checkPoints[checkIndex];
    $('checkStatus').textContent = `${checkIndex + 1} / ${checkPoints.length}点`;
    $('checkCoords').textContent = `base(${pt.base.x}, ${pt.base.y})`;
  }

  function goToCheckPoint(i) {
    if (!checkPoints.length || !dimBase) return;
    const pt = checkPoints[i];
    const maxZoom = mapBase.getMaxZoom();
    const ll = mapBase.unproject(L.point(pt.base.x, pt.base.y), maxZoom);
    mapBase.setView(ll, maxZoom, { animate: true });
    updateCheckStatus();
  }

  function navigateCheckPoint(delta) {
    if (!checkPoints.length) return;
    checkIndex = (checkIndex + delta + checkPoints.length) % checkPoints.length;
    goToCheckPoint(checkIndex);
  }

  async function fetchCheckPoints(url, silent = false) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${url} が見つかりません (${res.status})`);
      const data = await res.json();
      checkPoints = data.points || [];
      checkIndex  = checkPoints.length > 0 ? 0 : -1;
      updateCheckStatus();
      // 自動ジャンプは地図ロード後に行うため dimBase が揃っていれば実行
      if (checkIndex >= 0 && dimBase) goToCheckPoint(checkIndex);
    } catch (e) {
      if (!silent) alert(e.message);
    }
  }


  document.addEventListener('keydown', (e) => {
    if (e.code === 'Escape' && !e.repeat) {
      e.preventDefault();
      focusMapInteraction();
      return;
    }
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    const s = step();
    if      (e.key === 'ArrowUp')    { e.preventDefault(); adjustOffset(0, -s); }
    else if (e.key === 'ArrowDown')  { e.preventDefault(); adjustOffset(0,  s); }
    else if (e.key === 'ArrowLeft')  { e.preventDefault(); adjustOffset(-s, 0); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); adjustOffset( s, 0); }
    else if (e.key === 'a' || e.key === 'A') { e.preventDefault(); navigateOverlay(-1); }
    else if (e.key === 's' || e.key === 'S') { e.preventDefault(); navigateOverlay(+1); }
    else if (e.key === 'Shift') { e.preventDefault();
      const cur = parseFloat($('blend').value);
      animateBlend(Math.abs(cur - BLEND_A) >= Math.abs(cur - BLEND_B) ? BLEND_A : BLEND_B);
    }
    else if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); navigateCheckPoint(-1); }
    else if (e.key === 'x' || e.key === 'X') { e.preventDefault(); navigateCheckPoint(+1); }
    else if (e.code === 'Space') { e.preventDefault(); }
    else if (e.key === 'Backspace' && e.shiftKey) { e.preventDefault(); $('clearPoints').click(); }
    else if (e.key === 'Backspace') { e.preventDefault(); $('undoPoint').click(); }
    else if (e.key === 'Enter') { e.preventDefault(); $('downloadJson').click(); }
  });
  document.addEventListener('keyup', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.code === 'Space') {
      e.preventDefault();
      $('recordPoint').click();
    }
  });
  $('tintBase').addEventListener('change', (e) => {
    const f = e.target.checked ? 'hue-rotate(240deg)' : '';
    mapBase.getContainer().querySelectorAll('.leaflet-tile-pane').forEach(el => el.style.filter = f);
  });
  function applyRotateAlign(on) {
    const clip  = $('stage-clip');
    const stage = $('stage');
    const W = clip.clientWidth, H = clip.clientHeight;
    if (on) {
      const sw = W * ALIGN_COS + H * ALIGN_SIN;
      const sh = W * ALIGN_SIN + H * ALIGN_COS;
      stage.style.width     = sw + 'px';
      stage.style.height    = sh + 'px';
      stage.style.left      = ((W - sw) / 2) + 'px';
      stage.style.top       = ((H - sh) / 2) + 'px';
      stage.style.transform = `rotate(${ALIGN_DEG}deg)`;
    } else {
      stage.style.width = stage.style.height = '';
      stage.style.left  = stage.style.top    = '';
      stage.style.transform = '';
    }
    setTimeout(() => { mapBase.invalidateSize(); mapOverlay.invalidateSize(); }, 50);
  }
  $('rotateAlign').addEventListener('change', (e) => applyRotateAlign(e.target.checked));
  window.addEventListener('resize', () => { if ($('rotateAlign').checked) applyRotateAlign(true); });

  // ---- leaflet-iiif レイヤ追加（load まで待つ）----
  function addIiifLayer(map, infoUrl, opts) {
    return new Promise((resolve, reject) => {
      const layer = L.tileLayer.iiif(infoUrl, opts)
        .on('load', () => resolve(layer))
        .on('tileerror', (e) => console.warn('tileerror', e))
        .on('error', (e) => reject(e))
        .addTo(map);
    });
  }

  // ===== クリック → フル解像度 px で 80×80 を出力（より不透明な方を自動選択） =====
  const REGION = 80; // 一辺の長さ（px, フル解像度基準）
  let svcBase = null, svcOverlay = null;     // “…/iiif/2/…tif”
  let dimBase = null, dimOverlay = null;     // {width, height}（フル解像度）

  // container px → 現在ビュー内部座標を経由 → フル解像度 px へ線形変換
  function containerToFullPx(map, dims, containerPoint) {
    const fullW = dims.width  ?? dims['@width'];
    const fullH = dims.height ?? dims['@height'];
    const z = map.getZoom();

    // 画像の (0,0) と (fullW,fullH) を現在ズームに投影（= この CRS 上の絶対座標）
    const originLL = map.unproject(L.point(0, 0), z);                 // 左上
    const maxLL    = map.unproject(L.point(fullW, fullH), z);         // 右下

    // クリック位置の CRS 座標
    const ll = map.containerPointToLatLng(containerPoint);

    // 画像全体に対する相対位置（0..1）
    let rx = (ll.lng - originLL.lng) / (maxLL.lng - originLL.lng);
    let ry = (ll.lat - originLL.lat) / (maxLL.lat - originLL.lat);
    rx = Math.min(1, Math.max(0, rx));
    ry = Math.min(1, Math.max(0, ry));

    // フル解像度 px に戻す
    return { x: rx * fullW, y: ry * fullH };
  }

  // 中心（フル解像度）→ 固定サイズの領域（端はクランプ）
  function centerToPixelRegion(fullPt, dims, size) {
    const fullW = dims.width  ?? dims['@width'];
    const fullH = dims.height ?? dims['@height'];
    let x = Math.round(fullPt.x - size / 2);
    let y = Math.round(fullPt.y - size / 2);
    x = Math.max(0, Math.min(x, Math.max(0, fullW - size)));
    y = Math.max(0, Math.min(y, Math.max(0, fullH - size)));
    return { x, y, w: size, h: size };
  }

  function buildPixelUrl(serviceBase, r) {
    // 例）https://iiif.nihu.jp/iiif/2/laj_map%2FLAJ_019.tif/7610,4730,80,80/full/0/default.jpg
    return `${serviceBase}/${r.x},${r.y},${r.w},${r.h}/full/0/default.jpg`;
  }

  function moreOpaqueLayer() {
    const v = parseFloat(document.getElementById('blend').value || '0.5'); // 下= v, 上= 1-v
    if (v > 0.5) return 'base';
    if (v < 0.5) return 'overlay';
    return 'both';
  }

  // 下の地図をクリック（上は pointer-events: none）
  mapBase.on('click', (e) => {
    const which = moreOpaqueLayer();

    if ((which === 'base' || which === 'both') && svcBase && dimBase) {
      const fullPtB = containerToFullPx(mapBase, dimBase, e.containerPoint);
      const rB = centerToPixelRegion(fullPtB, dimBase, REGION);
      console.log(`[${$('labelBase').textContent}]`, buildPixelUrl(svcBase, rB));
    }

    if ((which === 'overlay' || which === 'both') && svcOverlay && dimOverlay) {
      // オーバーレイは CSS translate 分を補正してから同じ変換
      const pOver = L.point(e.containerPoint.x - overlayOffset.x, e.containerPoint.y - overlayOffset.y);
      const fullPtO = containerToFullPx(mapOverlay, dimOverlay, pOver);
      const rO = centerToPixelRegion(fullPtO, dimOverlay, REGION);
      console.log(`[${$('labelOverlay').textContent}]`, buildPixelUrl(svcOverlay, rO));
    }
  });

  // ===== 読み込み =====
  async function loadPair() {
    $('labelBase').textContent    = $('selectBase').value.trim();
    $('labelOverlay').textContent = $('selectOverlay').value.trim();

    // 既存レイヤ除去・オフセット初期化
    if (layerBase)    mapBase.removeLayer(layerBase);
    if (layerOverlay) mapOverlay.removeLayer(layerOverlay);
    overlayOffset = {x:0,y:0}; applyOverlayOffset();

    // キャリブレーション記録をクリア
    calibrationPoints = [];
    $('pointCount').textContent = '0';
    $('lastRecorded').textContent = '';

    // マニフェスト → info.json（プロキシなしで直接取得）
    const [manB, manO] = await Promise.all([
      fetch(buildManifestUrl($('selectBase').value.trim())).then(r=>r.json()),
      fetch(buildManifestUrl($('selectOverlay').value.trim())).then(r=>r.json()),
    ]);
    let infoB = infoFromManifest(manB);
    let infoO = infoFromManifest(manO);
    if (!infoB || !infoO) { alert("info.json を抽出できませんでした"); return; }

    // service base とフル解像度寸法
    svcBase    = stripInfo(infoB);
    svcOverlay = stripInfo(infoO);
    const [iB, iO] = await Promise.all([ fetch(infoB).then(r=>r.json()), fetch(infoO).then(r=>r.json()) ]);
    dimBase    = { width: iB.width  || iB['@width'],  height: iB.height  || iB['@height'] };
    dimOverlay = { width: iO.width  || iO['@width'],  height: iO.height  || iO['@height'] };

    const v = parseFloat($('blend').value);

    // 下：fitBounds / noWrap（setMaxBounds は後で余白付きで上書き）
    layerBase = await addIiifLayer(mapBase, infoB, {
      fitBounds:true, setMaxBounds:false, noWrap:true, opacity:v
    });

    // 地図の端が画面中央まで来られるよう、bounds を画像サイズ分だけ拡張する
    // L.TileLayer.Iiif は getBounds() を持たないので dimBase から手動構築
    // pad(1) = 各辺に画像縦横幅と同じ余白を追加
    const maxZoom = mapBase.getMaxZoom();
    const imgSW = mapBase.unproject(L.point(0,             dimBase.height), maxZoom);
    const imgNE = mapBase.unproject(L.point(dimBase.width, 0),              maxZoom);
    mapBase.setMaxBounds(L.latLngBounds(imgSW, imgNE).pad(1));

    // 上：一旦 fitBounds（重要）/ noWrap
    layerOverlay = await addIiifLayer(mapOverlay, infoO, {
      fitBounds:true, setMaxBounds:false, noWrap:true, opacity:1-v
    });

    // 直後にビューを完全同期
    syncOverlayView();

    // 地図ロード完了後、点チェックが読み込み済みなら先頭点にジャンプ
    if (checkIndex >= 0) goToCheckPoint(checkIndex);
    updateNoteViewerLink();
    noteBroadcaster?.publish();
  }

  // プルダウン変更で自動読み込み
  function onSelectChange() {
    if ($('selectBase').value && $('selectOverlay').value) {
      loadPair().catch(e => {
        console.error('loadPair failed:', e);
        alert(e?.message || e);
      });
    }
  }
  function blockSelectArrowNavigation(e) {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      e.stopPropagation();
    }
  }
  $('selectBase').addEventListener('change', onSelectChange);
  $('selectOverlay').addEventListener('change', onSelectChange);
  $('selectBase').addEventListener('keydown', blockSelectArrowNavigation);
  $('selectOverlay').addEventListener('keydown', blockSelectArrowNavigation);

  // ===== キャリブレーション記録 =====
  // 画面中央の containerPoint を取得
  function getContainerCenter() {
    const container = $('mapBase');
    return L.point(container.clientWidth / 2, container.clientHeight / 2);
  }

  function updateCalibrationSummary() {
    $('pointCount').textContent = calibrationPoints.length;
    if (calibrationPoints.length === 0) {
      $('lastRecorded').textContent = '';
      return;
    }
    const point = calibrationPoints[calibrationPoints.length - 1];
    $('lastRecorded').textContent = `base(${point.base.x}, ${point.base.y}) / overlay(${point.overlay.x}, ${point.overlay.y})`;
  }

  // 記録ボタン
  $('recordPoint').addEventListener('click', () => {
    if (!dimBase || !dimOverlay) {
      alert('画像を先に読み込んでください');
      return;
    }

    // 画面中央の containerPoint
    const centerPt = getContainerCenter();

    // ベース画像：画面中央そのまま
    const baseCenter = containerToFullPx(mapBase, dimBase, centerPt);

    // オーバーレイ画像：CSS offset を補正（オーバーレイが右にずれている場合、実際の画像上では左側を見ている）
    const overlayPt = L.point(centerPt.x - overlayOffset.x, centerPt.y - overlayOffset.y);
    const overlayCenter = containerToFullPx(mapOverlay, dimOverlay, overlayPt);

    if (!baseCenter || !overlayCenter) {
      alert('座標の取得に失敗しました');
      return;
    }

    const point = {
      base: { x: Math.round(baseCenter.x), y: Math.round(baseCenter.y) },
      overlay: { x: Math.round(overlayCenter.x), y: Math.round(overlayCenter.y) },
      offset: { x: overlayOffset.x, y: overlayOffset.y }
    };

    calibrationPoints.push(point);
    updateCalibrationSummary();
  });

  // 1個戻すボタン
  $('undoPoint').addEventListener('click', () => {
    if (calibrationPoints.length === 0) return;
    const point = calibrationPoints[calibrationPoints.length - 1];
    if (!confirm(`直前の記録を削除しますか？\nbase(${point.base.x}, ${point.base.y}) / overlay(${point.overlay.x}, ${point.overlay.y})`)) return;
    calibrationPoints.pop();
    updateCalibrationSummary();
  });

  // クリアボタン
  $('clearPoints').addEventListener('click', () => {
    if (calibrationPoints.length === 0) return;
    if (!confirm(`${calibrationPoints.length}点の記録をクリアしますか？`)) return;
    calibrationPoints = [];
    updateCalibrationSummary();
  });

  // ダウンロードボタン
  $('downloadJson').addEventListener('click', () => {
    if (calibrationPoints.length === 0) {
      alert('記録がありません');
      return;
    }

    const data = {
      baseId: $('selectBase').value.trim(),
      overlayId: $('selectOverlay').value.trim(),
      timestamp: new Date().toISOString(),
      points: calibrationPoints
    };

    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = `${data.baseId}_${data.overlayId}.json`;
    a.click();

    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
